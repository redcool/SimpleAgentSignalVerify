[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "signalverify"
version = "0.0.1"
description = "Deterministic signal verification for agents: lip-sync offset, lyric timing, contact sheets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.23", "opencv-python>=4.8"]

[project.optional-dependencies]
asr = ["transformers>=4.40", "torch", "scipy"]

[project.scripts]
signalverify = "signalverify.cli:main"

[tool.setuptools.packages.find]
include = ["signalverify*"]
